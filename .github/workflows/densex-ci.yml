# DenseX CI: CPU-only allowlisted tests and llama_context state tests on a generated Qwen35 dummy model
# (save/load/copy/rollback/replay...), with deferred GDN commit on (default) and off.
# GitHub runners have no GPU; GPU op tests and output checks run locally (research workspace bench/regress.ps1).
name: DenseX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context-tests:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python (env-default snapshot)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: DENSEX env-default snapshot
        run: python scripts/densex_env_snapshot.py --check

      - name: Configure (CPU only)
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DGGML_CUDA=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_COMMON=ON
          -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
          -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_LLGUIDANCE=OFF

      - name: Build tests
        run: cmake --build build --config Release --parallel

      - name: CPU tests (allowlist)
        shell: pwsh
        env:
          CTEST_BUILD_DIR: build
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = $env:CTEST_BUILD_DIR
          $listPath = Join-Path $env:GITHUB_WORKSPACE 'tests/densex-ci-tests.txt'
          $tests = @(Get-Content -LiteralPath $listPath | ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and !$_.StartsWith('#') })
          if ($tests.Count -eq 0) { throw 'CPU test allowlist is empty' }
          $expected = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($name in $tests) {
              if (!$expected.Add($name)) { throw "Duplicate allowlist entry: $name" }
          }
          function Assert-TestNames([string[]]$Names, [string]$Phase) {
              if ($Names.Count -ne $tests.Count) {
                  throw "${Phase}: expected $($tests.Count) tests, got $($Names.Count)"
              }
              $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
              foreach ($name in $Names) {
                  if (!$expected.Contains($name) -or !$seen.Add($name)) {
                      throw "${Phase}: unexpected or duplicate test: $name"
                  }
              }
          }
          $pattern = '^(' + (($tests | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
          $selection = & ctest --test-dir $buildDir -C Release -R $pattern --show-only=json-v1
          $selectionCode = $LASTEXITCODE
          if ($selectionCode -ne 0) { throw "ctest selection failed: $selectionCode" }
          $registered = ($selection -join "`n") | ConvertFrom-Json
          Assert-TestNames @($registered.tests | ForEach-Object { $_.name }) 'Selected tests'
          $junit = [IO.Path]::GetFullPath((Join-Path $buildDir 'densex-ci-junit.xml'))
          & ctest --test-dir $buildDir -C Release -R $pattern --no-tests=error --output-on-failure --timeout 300 -j 4 --output-junit $junit
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) { throw "ctest failed: $testCode" }
          [xml]$results = Get-Content -LiteralPath $junit -Raw
          $cases = @($results.SelectNodes('//testcase'))
          Assert-TestNames @($cases | ForEach-Object { $_.GetAttribute('name') }) 'Completed tests'
          foreach ($case in $cases) {
              if ($case.GetAttribute('status') -ne 'run' -or $case.SelectSingleNode('failure|error|skipped')) {
                  throw "Test did not pass: $($case.GetAttribute('name'))"
              }
          }
          Write-Host "CPU_CTEST_PASS $($cases.Count)/$($tests.Count)"

      - name: Generate Qwen35 dummy model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force qwen-models | Out-Null
          build/bin/Release/test-llama-archs.exe -a qwen35 -o qwen-models
          if (!(Get-ChildItem qwen-models -Filter *.gguf)) { throw 'no Qwen35 model generated' }

      - name: Context tests (deferred GDN default)
        run: build/bin/Release/test-llama-context.exe --models qwen-models --test ".*" -ngl 0 --fit off

      - name: Context tests (deferred GDN off)
        env:
          DENSEX_GDN_DEFERRED: "0"
        run: build/bin/Release/test-llama-context.exe --models qwen-models --test ".*" -ngl 0 --fit off

  cuda-compile:
    # Compile-only CUDA job. GitHub's Windows runners have no GPU; this job never
    # runs a CUDA kernel, it only proves sm86/sm89 compile and that the CUDA
    # backend/server targets still build.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install CUDA Toolkit 12.8.0 (pinned, compile only)
        # Jimver/cuda-toolkit@v0.2.20's windows-links.ts only knows up to 12.8.0;
        # CUDA 13.0 is not selectable by this pinned action yet. Keep 12.8.0 and
        # treat this job as a compile/syntax smoke, not an exact local-13.0 mirror.
        uses: Jimver/cuda-toolkit@v0.2.20
        with:
          cuda: '12.8.0'
          method: 'network'
          # Only the compiler/runtime/headers needed by ggml-cuda + llama-server;
          # the full toolkit otherwise exhausts the ~14 GB Windows runner disk.
          # Windows CUDA 12.8 installer ships CCCL/CUB/Thrust headers under thrust_12.8 (not cccl_12.8).
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Configure (CUDA sm86;sm89, compile only)
        shell: pwsh
        run: |
          cmake -S . -B build-cuda -G "Visual Studio 17 2022" -A x64 `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="86;89" `
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_COMMON=ON `
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF `
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_LLGUIDANCE=OFF

      - name: Build ggml-cuda and llama-server (no run)
        shell: pwsh
        run: |
          cmake --build build-cuda --config Release --target ggml-cuda llama-server --parallel 2
